<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>my position page</title>
<style>
</style>

</head>
<style>
    div {
    width: 200px;
    height: 200px;
    background-image: url("pfp.jpg");
    margin: 50px;
    }

    #static {
        position: static;
    }

    #sticky{
        position: sticky;
    }

    #relative{
        position: relative;
        left: 100px;
        top: -100px;
        z-index: -5;
    }

    #fixed{
        position: fixed;
        left: 200px;
        top: 0;
    }

    #absolute{
        position: absolute;
        left: 300;
        bottom: -300;
    }

</style>
     
<body>

    <div id="static"></div>
    <div id="sticky"></div>
    <div id="relative"></div>
    <div id="fixed"></div>
    <div id="absolute"></div>
    
    
</body>
</html>
