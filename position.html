<!doctype html>
            
<html lang="en">

<head>
<meta charset="utf-8">
<title>my position page</title>
<style>
</style>

</head>
<style>
    div {
    width: 200px;
    height: 200px;
    background: white;
    margin: 50px;
    }

    #static {
        background: red;
        position: static;
    }

    #sticky{
        background: orange;
        position: sticky;
    }

    #relative{
        background: yellow;
        position: relative;
    }

    #fixed{
        background: green;
        position: fixed;
    }

    #absolute{
        background: blue;
        position: absolute;
    }

</style>
     
<body>

    <div id="static"></div>
    <div id="sticky"></div>
    <div id="relative"></div>
    <div id="fixed"></div>
    <div id="absolute"></div>
    
    
</body>
</html>
